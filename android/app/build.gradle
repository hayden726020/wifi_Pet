plugins {
    id 'com.android.application'
}

def releaseProps = new Properties()
def releasePropsFile = rootProject.file('../work/android-signing/signing.properties')
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}

android {
    namespace 'com.petcard.companion'
    compileSdk 36

    defaultConfig {
        applicationId 'com.petcard.companion'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        release {
            if (releasePropsFile.exists()) {
                storeFile rootProject.file(releaseProps.getProperty('storeFile'))
                storePassword releaseProps.getProperty('storePassword')
                keyAlias releaseProps.getProperty('keyAlias')
                keyPassword releaseProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releasePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
